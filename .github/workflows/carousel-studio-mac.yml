name: Carousel Studio — build Mac app

# Builds the brand-locked carousel and clip app (01_mss/tools/carousel-studio)
# as an unsigned Mac installer, for Apple Silicon and Intel. Free: macOS
# runners cost nothing on a public repo.
#
# Run it by hand from the Actions tab (the .dmg files land as a downloadable
# artifact), or push a tag like carousel-studio-v0.1.0 to also publish them as
# a GitHub release with a public download link.

on:
  workflow_dispatch:
  push:
    tags:
      - 'carousel-studio-v*'

concurrency:
  group: carousel-studio-mac-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: 01_mss/tools/carousel-studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 01_mss/tools/carousel-studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Render check on macOS (slides, feed clip, reel clip)
        run: npx electron . --selftest="$RUNNER_TEMP/selftest-dev"
        env:
          STUDIO_WORK_DIR: ${{ runner.temp }}/work-dev

      - name: Build Apple Silicon app
        run: npx electron-builder --mac --arm64 --publish never

      - name: Render check from the packaged app (proves bundled ffmpeg is found)
        run: '"dist/mac-arm64/PureMed Studio.app/Contents/MacOS/PureMed Studio" --selftest="$RUNNER_TEMP/selftest-app"'
        env:
          STUDIO_WORK_DIR: ${{ runner.temp }}/work-app

      # ffmpeg-static downloads one binary for the machine it installs on, so
      # swap in the Intel binary before building the Intel app.
      - name: Swap in the Intel ffmpeg binary
        run: |
          rm -f node_modules/ffmpeg-static/ffmpeg
          npm_config_arch=x64 node node_modules/ffmpeg-static/install.js
          file node_modules/ffmpeg-static/ffmpeg | grep -q x86_64

      - name: Build Intel app
        run: npx electron-builder --mac --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: carousel-studio-mac
          path: 01_mss/tools/carousel-studio/dist/*.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: carousel-studio-render-check
          path: ${{ runner.temp }}/selftest-app

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/carousel-studio-v')
        uses: softprops/action-gh-release@v2
        with:
          files: 01_mss/tools/carousel-studio/dist/*.dmg
          body: |
            Unsigned Mac build. Download the file for your Mac:
            - Apple Silicon (M1 and later): the arm64 .dmg
            - Older Intel Macs: the x64 .dmg
            First open: see "Installing on a Mac" in 01_mss/tools/carousel-studio/README.md.
