<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD Viewer — Main Stage Studio</title>

<!-- Brand fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<!-- Markdown parser -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<!-- HTML sanitizer -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>

<style>
/* ─── Brand tokens ─── */
:root {
  --parchment:  #F5EFE5;
  --blush:      #E8C9AE;
  --terracotta: #BF6B47;
  --ember:      #8C4A2F;
  --near-black: #1C1712;

  --header-h: 52px;
  --sidebar-w: 240px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--parchment);
  color: var(--near-black);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 300;
  font-size: 16px;
  line-height: 1.7;
}

/* ─── Fixed top header ─── */
#site-header {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--header-h);
  background: var(--near-black);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 20px;
  z-index: 100;
}

#site-header .wordmark {
  display: flex;
  flex-direction: column;
  line-height: 1.1;
}

#site-header .wordmark-main {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  font-size: 15px;
  color: var(--parchment);
  letter-spacing: 0.01em;
}

#site-header .wordmark-sub {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 500;
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--terracotta);
}

/* ─── Page shell below header ─── */
#shell {
  display: flex;
  padding-top: var(--header-h);
  min-height: 100vh;
}

/* ─── Left sidebar ─── */
#sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  border-right: 1px solid rgba(28,23,18,0.15);
  padding: 24px 0;
  position: fixed;
  top: var(--header-h);
  bottom: 0;
  left: 0;
  overflow-y: auto;
  background: var(--parchment);
}

#sidebar.hidden { display: none; }

#sidebar-header {
  padding: 0 18px 16px;
  border-bottom: 1px solid rgba(28,23,18,0.1);
  margin-bottom: 8px;
}

/* ─── Breadcrumb — shared styles for sidebar and single-file strip ─── */
#sidebar-breadcrumb,
#main-breadcrumb {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 11px;
  font-weight: 300;
  color: rgba(28,23,18,0.45);
  line-height: 1.5;
  word-break: break-word;
}

#sidebar-breadcrumb {
  margin-bottom: 10px;
}

/* The "/" separator between breadcrumb segments */
#sidebar-breadcrumb .bc-sep,
#main-breadcrumb .bc-sep {
  margin: 0 5px;
  opacity: 0.55;
}

/* Current (last) segment in terracotta */
#sidebar-breadcrumb .bc-current,
#main-breadcrumb .bc-current {
  color: var(--terracotta);
  font-weight: 400;
}

/* Single-file breadcrumb strip above content — hidden until a file-only load occurs */
#main-breadcrumb {
  margin-bottom: 24px;
  display: none;
}

#btn-folder {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 12px;
  font-weight: 400;
  background: none;
  border: 1px solid rgba(28,23,18,0.25);
  color: var(--near-black);
  padding: 6px 10px;
  cursor: pointer;
  width: 100%;
  text-align: left;
  transition: border-color 0.15s, color 0.15s;
}

#btn-folder:hover {
  border-color: var(--terracotta);
  color: var(--terracotta);
}

#file-list {
  list-style: none;
  padding: 0;
}

#file-list li {
  padding: 0;
}

#file-list button {
  display: flex;
  align-items: baseline;
  gap: 0;
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  padding: 9px 18px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13px;
  font-weight: 300;
  color: var(--near-black);
  cursor: pointer;
  line-height: 1.4;
  transition: background 0.1s, color 0.1s;
}

#file-list button:hover {
  background: rgba(232,201,174,0.4);
  color: var(--terracotta);
}

#file-list button.active {
  background: rgba(232,201,174,0.6);
  color: var(--ember);
  font-weight: 400;
}

/* Numbered prefix on ordered files */
#file-list .file-num {
  font-size: 10px;
  color: rgba(28,23,18,0.3);
  font-weight: 400;
  font-variant-numeric: tabular-nums;
  min-width: 18px;
  flex-shrink: 0;
  padding-right: 6px;
  line-height: inherit;
}

/* Subdirectory group label */
#file-list .dir-group {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--terracotta);
  padding: 18px 18px 4px;
  list-style: none;
  opacity: 0.8;
}

/* Thin rule separating ordered files from the unordered "other" section */
#file-list .other-files-sep {
  list-style: none;
  padding: 0 18px;
  margin: 10px 0 4px;
}

#file-list .other-files-sep::before {
  content: '';
  display: block;
  border-top: 1px solid rgba(28,23,18,0.12);
  margin-bottom: 6px;
}

#file-list .other-files-label {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(28,23,18,0.35);
  list-style: none;
  padding: 0 18px 4px;
}

/* ─── Main content area ─── */
#main {
  flex: 1;
  padding: 48px 56px 80px;
  min-width: 0;
  /* shift right when sidebar is visible */
  margin-left: var(--sidebar-w);
  transition: margin-left 0.2s;
}

#main.no-sidebar { margin-left: 0; }

/* ─── Drop zone overlay ─── */
#drop-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(245,239,229,0.88);
  z-index: 200;
  align-items: center;
  justify-content: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px;
  font-weight: 400;
  color: var(--terracotta);
  letter-spacing: -0.01em;
  pointer-events: none;
}

#drop-overlay.visible { display: flex; }

/* ─── Empty state ─── */
#empty-state {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 20px;
  padding-top: 40px;
}

#empty-state h2 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  font-size: 32px;
  letter-spacing: -0.02em;
  color: var(--near-black);
}

#empty-state p {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 300;
  font-size: 15px;
  color: rgba(28,23,18,0.6);
  max-width: 42ch;
  line-height: 1.65;
}

#empty-state .actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
  margin-top: 8px;
}

.btn-primary {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13px;
  font-weight: 400;
  background: var(--terracotta);
  color: var(--parchment);
  border: none;
  padding: 10px 18px;
  cursor: pointer;
  transition: background 0.15s;
}

.btn-primary:hover { background: var(--ember); }

.btn-secondary {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13px;
  font-weight: 400;
  background: none;
  border: 1px solid rgba(28,23,18,0.3);
  color: var(--near-black);
  padding: 10px 18px;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}

.btn-secondary:hover {
  border-color: var(--terracotta);
  color: var(--terracotta);
}

#no-fsapi-note {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 12px;
  font-weight: 300;
  color: rgba(28,23,18,0.5);
  font-style: italic;
  margin-top: 4px;
}

/* Hidden native file inputs */
#file-input { display: none; }

/* ─── Rendered markdown content ─── */
#content {
  max-width: 65ch;
  display: none;
}

#content.visible { display: block; }

/* File title shown above content */
#content-filename {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--terracotta);
  margin-bottom: 32px;
  display: block;
}

/* ─── Markdown rendering styles ─── */
#content h1 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  font-size: 42px;
  line-height: 1.15;
  letter-spacing: -0.025em;
  color: var(--near-black);
  margin: 0 0 28px;
  text-align: left;
}

#content h2 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  font-size: 28px;
  line-height: 1.2;
  letter-spacing: -0.015em;
  color: var(--near-black);
  margin: 48px 0 16px;
  padding-bottom: 8px;
  /* Terracotta accent rule under h2 */
  border-bottom: 1.5px solid var(--terracotta);
}

#content h3 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  font-size: 22px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  color: var(--near-black);
  margin: 36px 0 12px;
}

/* h4/h5 as small-caps style labels */
#content h4,
#content h5 {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 500;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--terracotta);
  margin: 28px 0 8px;
}

#content h6 {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 400;
  font-size: 13px;
  color: rgba(28,23,18,0.65);
  margin: 24px 0 8px;
}

#content p {
  margin: 0 0 18px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 300;
  font-size: 16px;
  line-height: 1.75;
}

#content ul,
#content ol {
  margin: 0 0 18px 24px;
  padding: 0;
}

#content li {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 300;
  font-size: 16px;
  line-height: 1.7;
  margin-bottom: 6px;
}

/* Task list checkboxes (GFM) */
#content input[type="checkbox"] {
  margin-right: 6px;
  accent-color: var(--terracotta);
}

#content a {
  color: var(--terracotta);
  text-decoration: none;
  border-bottom: 1px solid rgba(191,107,71,0.35);
  transition: color 0.15s, border-color 0.15s;
}

#content a:hover,
#content a:focus {
  color: var(--ember);
  border-bottom-color: var(--ember);
}

#content a:visited { color: var(--ember); }

#content strong { font-weight: 500; }
#content em { font-style: italic; }

#content del {
  text-decoration: line-through;
  opacity: 0.55;
}

/* Inline code */
#content code {
  font-family: ui-monospace, 'Cascadia Code', 'Menlo', monospace;
  font-size: 13.5px;
  color: var(--terracotta);
  background: var(--blush);
  padding: 1px 5px;
  border-radius: 2px;
}

/* Fenced code blocks */
#content pre {
  background: var(--blush);
  padding: 20px 22px;
  overflow-x: auto;
  margin: 0 0 24px;
  border-radius: 2px;
}

#content pre code {
  /* Reset inline code styles inside a block */
  color: var(--near-black);
  background: none;
  padding: 0;
  font-size: 13px;
  line-height: 1.65;
}

/* Blockquotes */
#content blockquote {
  border-left: 3px solid var(--terracotta);
  background: rgba(232,201,174,0.28);
  margin: 0 0 24px;
  padding: 14px 20px;
}

#content blockquote p {
  margin: 0;
  font-style: italic;
  color: var(--near-black);
}

/* Horizontal rules */
#content hr {
  border: none;
  border-top: 1px solid rgba(28,23,18,0.18);
  margin: 40px 0;
}

/* Tables */
#content table {
  width: 100%;
  border-collapse: collapse;
  margin: 0 0 28px;
  font-size: 14px;
}

#content th {
  background: var(--blush);
  color: var(--near-black);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 500;
  font-size: 13px;
  letter-spacing: 0.03em;
  text-align: left;
  padding: 10px 14px;
  border: 1px solid rgba(28,23,18,0.2);
}

#content td {
  padding: 9px 14px;
  border: 1px solid rgba(28,23,18,0.12);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 300;
  font-size: 14px;
  line-height: 1.55;
  background: var(--parchment);
}

/* Alternating row tint */
#content tr:nth-child(even) td {
  background: rgba(232,201,174,0.18);
}

/* Images */
#content img {
  max-width: 100%;
  height: auto;
  display: block;
  margin: 8px 0;
}
</style>
</head>
<body>

<!-- Drop overlay (shown during drag) -->
<div id="drop-overlay">Drop your .md file</div>

<!-- Fixed header -->
<header id="site-header">
  <!-- MSS canonical mark -->
  <svg width="32" height="32" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect x="2" y="16" width="24" height="22" rx="2.5" fill="#BF6B47"/>
    <rect x="14" y="2" width="24" height="22" rx="2.5" fill="#1C1712"/>
    <rect x="14" y="16" width="12" height="8" rx="1.5" fill="#F5EFE5"/>
  </svg>
  <div class="wordmark">
    <span class="wordmark-main">Main Stage</span>
    <span class="wordmark-sub">Studio</span>
  </div>
</header>

<!-- Page shell -->
<div id="shell">

  <!-- Sidebar (folder browsing) — hidden initially -->
  <nav id="sidebar" class="hidden" aria-label="File list">
    <div id="sidebar-header">
      <!-- Breadcrumb: populated when a folder is opened. Shows just the picked
           folder's name — FSAPI doesn't expose the parent path. -->
      <nav id="sidebar-breadcrumb" aria-label="Location"></nav>
      <button id="btn-folder" title="Choose a different folder">Change folder</button>
    </div>
    <ul id="file-list" role="listbox"></ul>
  </nav>

  <!-- Main content -->
  <main id="main" class="no-sidebar">

    <!-- Empty state -->
    <div id="empty-state">
      <h2>Markdown Viewer</h2>
      <p>Drop a .md file anywhere on the page, or use one of the options below to load content.</p>
      <div class="actions">
        <button class="btn-primary" id="btn-single-file">Open file</button>
        <button class="btn-secondary" id="btn-open-folder">Open folder</button>
      </div>
      <p id="no-fsapi-note" style="display:none">
        Folder browsing isn't available in this browser (File System Access API required — try Chrome or Edge).
        Single-file upload works fine.
      </p>
    </div>

    <!-- Single-file breadcrumb: shown only when a file is loaded without a folder.
         Displays just the filename — the browser doesn't expose its parent path. -->
    <div id="main-breadcrumb"></div>

    <!-- Rendered content (hidden until a file is loaded) -->
    <div id="content" role="main">
      <span id="content-filename"></span>
      <div id="md-output"></div>
    </div>

  </main>
</div>

<!-- Hidden native file input for single-file upload -->
<input type="file" id="file-input" accept=".md,text/markdown,text/plain">

<script>
/* ─── marked.js config for GFM ─── */
marked.setOptions({
  gfm: true,       // GitHub Flavoured Markdown (tables, strikethrough)
  breaks: false,
});

/* ─── Element refs ─── */
const sidebar          = document.getElementById('sidebar');
const sidebarBreadcrumb = document.getElementById('sidebar-breadcrumb');
const mainBreadcrumb   = document.getElementById('main-breadcrumb');
const fileList         = document.getElementById('file-list');
const btnFolder        = document.getElementById('btn-folder');
const mainEl           = document.getElementById('main');
const emptyState       = document.getElementById('empty-state');
const contentEl        = document.getElementById('content');
const mdOutput         = document.getElementById('md-output');
const filenameLabel    = document.getElementById('content-filename');
const dropOverlay      = document.getElementById('drop-overlay');
const fileInput        = document.getElementById('file-input');
const btnSingle        = document.getElementById('btn-single-file');
const btnOpenFolder    = document.getElementById('btn-open-folder');
const fsApiNote        = document.getElementById('no-fsapi-note');

/* ─── Feature detect File System Access API ─── */
const hasFSAPI = typeof window.showDirectoryPicker === 'function';

if (!hasFSAPI) {
  btnOpenFolder.style.display = 'none';
  fsApiNote.style.display = 'block';
}

/* ─── Breadcrumb helpers ─── */

// Renders a breadcrumb into the sidebar header.
// segments: array of strings, e.g. ['my-folder'] or ['parent', 'child'].
// Only the last segment is shown in terracotta; the rest are dimmed.
function setSidebarBreadcrumb(segments) {
  sidebarBreadcrumb.innerHTML = '';
  segments.forEach((seg, i) => {
    if (i > 0) {
      const sep = document.createElement('span');
      sep.className = 'bc-sep';
      sep.textContent = '/';
      sidebarBreadcrumb.appendChild(sep);
    }
    const span = document.createElement('span');
    span.textContent = seg;
    if (i === segments.length - 1) span.className = 'bc-current';
    sidebarBreadcrumb.appendChild(span);
  });
}

// Shows a single-segment breadcrumb above the content for file-only loads.
// The browser doesn't expose the file's parent path, so only the name is shown.
function setMainBreadcrumb(filename) {
  mainBreadcrumb.innerHTML = '';
  const span = document.createElement('span');
  span.className = 'bc-current';
  span.textContent = filename;
  mainBreadcrumb.appendChild(span);
  mainBreadcrumb.style.display = 'block';
}

/* ─── Render a markdown string into the content pane ─── */
function renderMarkdown(mdText, filename) {
  const rawHtml   = marked.parse(mdText);
  const cleanHtml = DOMPurify.sanitize(rawHtml, {
    // Allow the checkbox inputs that GFM task lists produce
    ADD_TAGS: ['input'],
    ADD_ATTR: ['type', 'checked', 'disabled'],
  });
  mdOutput.innerHTML = cleanHtml;

  // Display the filename as a label (strip .md, replace hyphens/underscores)
  filenameLabel.textContent = filename
    .replace(/\.md$/i, '')
    .replace(/[-_]/g, ' ');

  emptyState.style.display = 'none';
  contentEl.classList.add('visible');
}

/* ─── Read a File object and render it (single-file mode) ─── */
async function loadFile(file) {
  if (!file) return;
  const text = await file.text();
  renderMarkdown(text, file.name);
  // Show the filename as a breadcrumb above the content (no path available)
  setMainBreadcrumb(file.name);
}

/* ─── Single-file upload (button + hidden input) ─── */
btnSingle.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  if (f) loadFile(f);
});

/* ─── Drag-and-drop ─── */
document.addEventListener('dragenter', (e) => {
  e.preventDefault();
  dropOverlay.classList.add('visible');
});

document.addEventListener('dragleave', (e) => {
  // Only hide overlay when leaving the window entirely
  if (e.relatedTarget === null) dropOverlay.classList.remove('visible');
});

document.addEventListener('dragover', (e) => {
  e.preventDefault();
});

document.addEventListener('drop', (e) => {
  e.preventDefault();
  dropOverlay.classList.remove('visible');
  const file = e.dataTransfer.files[0];
  if (file && (file.name.endsWith('.md') || file.type === 'text/markdown')) {
    loadFile(file);
    // Clear any active sidebar selection since this is a one-off drop
    document.querySelectorAll('#file-list button').forEach(b => b.classList.remove('active'));
  }
});

/* ─── Folder browsing via File System Access API ─── */
let folderEntries = []; // Array of { name, path, handle, orderNum }

// Recursively collect all .md files under a directory handle.
// path is the relative path from the root (empty string for root-level files).
async function collectMdFiles(dirHandle, path) {
  const results = [];
  for await (const [name, handle] of dirHandle.entries()) {
    if (handle.kind === 'file' && name.endsWith('.md')) {
      results.push({ name, path, handle, orderNum: null });
    } else if (handle.kind === 'directory') {
      const subPath = path ? `${path}/${name}` : name;
      results.push(...await collectMdFiles(handle, subPath));
    }
  }
  return results;
}

// Reads .order.json from the root of the picked directory.
// Returns a string[] if found and valid, or null to fall back to alphabetical.
async function readOrderFile(dirHandle) {
  try {
    const fh   = await dirHandle.getFileHandle('.order.json');
    const file  = await fh.getFile();
    const text  = await file.text();
    const arr   = JSON.parse(text);
    if (!Array.isArray(arr)) return null;
    return arr.filter(x => typeof x === 'string');
  } catch {
    return null; // Missing, unreadable, or not valid JSON
  }
}

// Re-sorts folderEntries so that files listed in orderedList come first
// (in that order, numbered), with any unlisted files appended alphabetically.
// Silently skips entries in orderedList that don't match any collected file.
function applyOrder(orderedList) {
  // Build a lookup: lowercase filename → position in the order list
  const orderMap = {};
  orderedList.forEach((name, i) => {
    orderMap[name.toLowerCase()] = i;
  });

  const ordered   = [];
  const unordered = [];

  folderEntries.forEach(entry => {
    const pos = orderMap[entry.name.toLowerCase()];
    if (pos !== undefined) {
      ordered[pos] = { ...entry, orderNum: pos + 1 };
    } else {
      unordered.push(entry);
    }
  });

  // Remove any slots that had no matching file
  const validOrdered = ordered.filter(Boolean);

  // Sort the unlisted remainder alphabetically by path then name
  unordered.sort((a, b) => {
    const pd = a.path.toLowerCase().localeCompare(b.path.toLowerCase());
    return pd !== 0 ? pd : a.name.toLowerCase().localeCompare(b.name.toLowerCase());
  });

  folderEntries = [...validOrdered, ...unordered];
}

async function openFolder() {
  if (!hasFSAPI) return;
  let dirHandle;
  try {
    dirHandle = await window.showDirectoryPicker({ mode: 'read' });
  } catch {
    // User cancelled — do nothing
    return;
  }

  folderEntries = await collectMdFiles(dirHandle, '');

  // Check for .order.json; apply ordered listing if present and valid
  const orderedList = await readOrderFile(dirHandle);
  if (orderedList && orderedList.length > 0) {
    applyOrder(orderedList);
  } else {
    // Fall back to alphabetical: sort by subdirectory path, then filename
    folderEntries.sort((a, b) => {
      const pd = a.path.toLowerCase().localeCompare(b.path.toLowerCase());
      return pd !== 0 ? pd : a.name.toLowerCase().localeCompare(b.name.toLowerCase());
    });
  }

  // Show the picked folder's name as a breadcrumb.
  // FSAPI only gives us this folder's name, not its full parent path.
  setSidebarBreadcrumb([dirHandle.name]);

  buildFileList();

  // Show sidebar, hide single-file breadcrumb, adjust main margin
  sidebar.classList.remove('hidden');
  mainEl.classList.remove('no-sidebar');
  mainBreadcrumb.style.display = 'none';

  // Auto-select first file
  if (folderEntries.length > 0) {
    selectEntry(0);
  }
}

function buildFileList() {
  fileList.innerHTML = '';

  const hasOrdered   = folderEntries.some(e => e.orderNum !== null);
  const hasUnordered = folderEntries.some(e => e.orderNum === null);
  let separatorAdded = false;
  let currentPath    = null;

  folderEntries.forEach((entry, idx) => {
    // Insert the "other files" separator once, between the ordered and unordered sections
    if (hasOrdered && hasUnordered && entry.orderNum === null && !separatorAdded) {
      separatorAdded = true;
      currentPath = null; // Reset so dir headings re-render correctly after the break

      const sepLi = document.createElement('li');
      sepLi.className = 'other-files-sep';
      fileList.appendChild(sepLi);

      const labelLi = document.createElement('li');
      labelLi.className = 'other-files-label';
      labelLi.textContent = 'Other files';
      fileList.appendChild(labelLi);
    }

    // Insert a directory heading whenever the subdirectory path changes (skip root-level)
    if (entry.path !== currentPath) {
      currentPath = entry.path;
      if (currentPath !== '') {
        const label = document.createElement('li');
        label.className = 'dir-group';
        label.textContent = currentPath.replace(/\//g, ' › ');
        fileList.appendChild(label);
      }
    }

    const li  = document.createElement('li');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.role = 'option';
    btn.dataset.idx = idx; // store index so selectEntry can match by dataset rather than DOM order

    // Numbered prefix for ordered entries
    if (entry.orderNum !== null) {
      const numSpan = document.createElement('span');
      numSpan.className = 'file-num';
      numSpan.textContent = entry.orderNum;
      btn.appendChild(numSpan);
    }

    btn.appendChild(
      document.createTextNode(
        entry.name.replace(/\.md$/i, '').replace(/[-_]/g, ' ')
      )
    );

    btn.addEventListener('click', () => selectEntry(idx));
    li.appendChild(btn);
    fileList.appendChild(li);
  });
}

async function selectEntry(idx) {
  const entry = folderEntries[idx];
  if (!entry) return;

  // Match active state by dataset.idx rather than DOM position (dir-group labels sit between buttons)
  document.querySelectorAll('#file-list button').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.idx, 10) === idx);
  });

  // Read fresh from disk each time — reflects any edits the user has made since loading
  const file = await entry.handle.getFile();
  const text = await file.text();
  renderMarkdown(text, entry.name);
}

/* ─── Folder open buttons ─── */
btnOpenFolder.addEventListener('click', openFolder);
btnFolder.addEventListener('click', openFolder);
</script>
