<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pipeline</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* MSS v6 A tokens: main-stage-studio/01_mss/brand/mss-v6-tokens.css */
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: #12110F;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Geist Mono', 'Menlo', monospace;
  }

  .stage { width: 1140px; }

  /* Caption strip. The first cut of this clip was raw stdout and nothing else,
     and it read as "something broke" rather than "the check worked". The
     narration is the fix: every command gets a plain-English line saying what
     it is for. */
  .cap {
    display: flex; align-items: baseline; gap: 14px;
    height: 78px;
    padding: 0 4px 20px;
    font-family: 'Archivo', system-ui, sans-serif; font-variation-settings: 'wdth' 100;
  }
  .cap-n {
    font-size: 13px;
    letter-spacing: 0.18em;
    color: #FFB21A;
    font-family: 'Geist Mono', monospace;
    flex: none;
    padding-top: 5px;
  }
  .cap-t {
    font-size: 21px;
    line-height: 1.35;
    color: #F3F1EC;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .cap-t.on { opacity: 1; transform: none; }

  .term {
    height: 596px;
    background: #1A1816;
    border: 1px solid #2E2B27;
    border-radius: 4px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.45);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .bar {
    height: 38px; flex: none;
    background: #1F1D1A;
    display: flex; align-items: center; gap: 8px;
    padding: 0 14px;
    border-bottom: 1px solid #2E2B27;
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .bar .t {
    margin-left: 12px;
    color: #8C8981;
    font-size: 12px; letter-spacing: 0.04em;
  }
  .body {
    flex: 1; padding: 20px 26px;
    font-size: 14.5px; line-height: 1.8;
    color: #D9D6CF;
    white-space: pre-wrap;
    overflow: hidden;
  }
  .p  { color: #FFB21A; }
  .c  { color: #F3F1EC; }
  .ok { color: #9BD48A; }
  .wa { color: #FFB21A; }
  .di { color: #8C8981; }
  .cursor {
    display: inline-block; width: 8px; height: 16px;
    background: #FFB21A; vertical-align: -2px;
    animation: bl 1s steps(1) infinite;
  }
  @keyframes bl { 50% { opacity: 0; } }
</style>
</head>
<body>
  <div class="stage">
    <div class="cap">
      <span class="cap-n" id="capn"></span>
      <span class="cap-t" id="capt"></span>
    </div>
    <div class="term">
      <div class="bar">
        <svg width="18" height="18" viewBox="0 0 40 40" aria-hidden="true"><path d="M5 17V5H17" stroke="#FFB21A" stroke-width="5" fill="none" stroke-linecap="square"/><path d="M35 23V35H23" stroke="#FFB21A" stroke-width="5" fill="none" stroke-linecap="square"/></svg>
        <span class="t">puremed · content pipeline</span>
      </div>
      <div class="body" id="out"></div>
    </div>
  </div>

<script>
// Every terminal line below is verbatim stdout from a real run against the
// PureMed content folder (re-run 10 Oct 2026 after the lint messages lost their
// em dashes; the preview step is no longer shown because re-running it rewrites
// tracked client files). The captions are written for the
// recording; the output is not.
//
// The earlier cut linted the whole directory in one command, which pulled in
// 2099-01-01-finishing-proof. That is a test fixture with no copy.md, so the
// run ended on a red ERROR that had nothing to do with the client's content
// and read as a broken tool. This cut lints the real August posts one at a
// time, which is a supported flag and a truer picture of the working day.
const script = [
  { t: 'cap', n: '01', s: 'What is waiting in the pipeline, and what state each post is in.' },
  { t: 'prompt' },
  { t: 'type', s: 'node content-state.js --client puremed --list' },
  { t: 'wait', ms: 420 },
  { t: 'out', cls: 'di', s: 'review         2026-08-01-laser-lift' },
  { t: 'out', cls: 'di', s: 'review         2026-08-03-liquid-facelift' },
  { t: 'out', cls: 'di', s: 'review         2026-08-05-trust' },
  { t: 'out', cls: 'di', s: 'review         2026-08-07-anti-wrinkle' },
  { t: 'out', cls: 'di', s: 'drafted        2099-01-01-finishing-proof' },
  { t: 'wait', ms: 1600 },
  { t: 'blank' },

  { t: 'cap', n: '02', s: 'Every post is checked against what a clinic is allowed to say. This one is clean.' },
  { t: 'prompt' },
  { t: 'type', s: 'node content-lint.js --client puremed --post 2026-08-01-laser-lift' },
  { t: 'wait', ms: 560 },
  { t: 'blank' },
  { t: 'out', cls: 'ok', s: '1 post(s) linted: 0 error(s), 0 warning(s)' },
  { t: 'wait', ms: 1600 },
  { t: 'blank' },

  { t: 'cap', n: '03', s: 'This one is not. The check holds it until the wording is confirmed compliant.' },
  { t: 'prompt' },
  { t: 'type', s: 'node content-lint.js --client puremed --post 2026-08-07-anti-wrinkle' },
  { t: 'wait', ms: 620 },
  { t: 'out', cls: 'wa', s: 'WARN  2026-08-07-anti-wrinkle/copy.md:1 "anti-wrinkle": pomSensitive' },
  { t: 'out', cls: 'wa', s: '      topic: confirm consultation-led framing, no price, no drug' },
  { t: 'out', cls: 'wa', s: '      references' },
  { t: 'blank' },
  { t: 'out', cls: 'di', s: '1 post(s) linted: 0 error(s), 1 warning(s)' },
  { t: 'wait', ms: 3200 }
];

const out = document.getElementById('out');
const capn = document.getElementById('capn');
const capt = document.getElementById('capt');
let cur = null;

function span(cls, text) {
  const s = document.createElement('span');
  if (cls) s.className = cls;
  s.textContent = text;
  out.appendChild(s);
  return s;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function setCap(n, text) {
  capt.classList.remove('on');
  await sleep(capn.textContent ? 420 : 0);
  capn.textContent = n;
  capt.textContent = text;
  await sleep(40);
  capt.classList.add('on');
  await sleep(750);
}

async function run() {
  await sleep(600);
  for (const step of script) {
    if (step.t === 'cap') {
      await setCap(step.n, step.s);
    } else if (step.t === 'prompt') {
      span('p', '→ puremed ');
      cur = span('c', '');
      const cs = document.createElement('span');
      cs.className = 'cursor';
      out.appendChild(cs);
      cur._cursor = cs;
    } else if (step.t === 'type') {
      for (const ch of step.s) {
        cur.textContent += ch;
        await sleep(22 + Math.random() * 28);
      }
      await sleep(280);
      if (cur._cursor) cur._cursor.remove();
      span('', '\n');
    } else if (step.t === 'out') {
      span(step.cls, step.s + '\n');
      await sleep(80);
    } else if (step.t === 'blank') {
      span('', '\n');
    } else if (step.t === 'wait') {
      await sleep(step.ms);
    }
    // Keep the newest line in frame once the buffer fills.
    out.scrollTop = out.scrollHeight;
  }
  window.__done = true;
}
run();
</script>
</body>
</html>
